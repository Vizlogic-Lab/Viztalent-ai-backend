# backend-classic — isolated local Postgres for this backend only.
#
# Deliberately separate from ../infra/docker-compose.yml (which backs the
# other smartstaff/backend microservices for frontend-v2) so table names
# and data never collide. Host port 15433 avoids native Postgres (5432)
# and the other stack's Docker Postgres (15432).
#
# Usage:
#   docker compose up -d
#   docker compose down          # stop (keeps data)
#   docker compose down -v       # stop AND delete data

services:
  postgres:
    image: postgres:16-alpine
    container_name: backend-classic-postgres
    environment:
      POSTGRES_DB: smartstaff_classic
      POSTGRES_USER: smartstaff_classic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartstaff_classic_dev}
    ports:
      - "15433:5432"
    volumes:
      - backend_classic_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstaff_classic -d smartstaff_classic"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-classic-app
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartstaff_classic
      SPRING_DATASOURCE_USERNAME: smartstaff_classic
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smartstaff_classic_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Storage for uploaded files (JDs, resumes)
    volumes:
      - ./storage:/app/storage
    # "runner" reaches Piston; "default" reaches Postgres and the outside world.
    networks:
      - default
      - runner

  # Code runner for candidate code. Not published on any host port and only on
  # the internal "runner" network, so only the app can reach it and the
  # sandbox has no internet. Save http://piston:2000/api/v2 as the Piston URL
  # in Settings, then install languages with scripts/install-runtimes.sh.
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: backend-classic-piston
    privileged: true   # required by Piston's isolate sandbox
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_RUN_TIMEOUT: "3000"
      PISTON_RUN_CPU_TIME: "3000"
      PISTON_COMPILE_TIMEOUT: "10000"
      PISTON_RUN_MEMORY_LIMIT: "268435456"   # 256 MB
      PISTON_OUTPUT_MAX_SIZE: "65536"        # 64 KB per stream
      PISTON_MAX_PROCESS_COUNT: "64"
    tmpfs:
      - /tmp:exec
    volumes:
      - piston_packages:/piston/packages
    networks:
      - runner
    restart: unless-stopped

networks:
  runner:
    internal: true

volumes:
  backend_classic_pg_data:
  piston_packages:
