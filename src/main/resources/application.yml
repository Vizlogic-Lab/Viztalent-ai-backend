server:
  port: ${SERVER_PORT:8000}
  shutdown: graceful

spring:
  application:
    name: backend-classic
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/smartstaff_classic}
    username: ${DB_USERNAME:smartstaff_classic}
    password: ${POSTGRES_PASSWORD:smartstaff_classic_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
    ttl-minutes: ${JWT_TTL_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  storage:
    dir: ${STORAGE_DIR:./storage}
  jobs:
    max-retained: 100
  encryption:
    key: ${APP_ENCRYPTION_KEY:dev-only-encryption-key-change-me}
  # External APIs — configurable so tests (and local demos) can point at a stub.
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    # Starting values only: admins choose the models in Settings → AI provider at
    # runtime. No model name is built in — Google retires models.
    model: ${GEMINI_MODEL:}
    fallback-model: ${GEMINI_FALLBACK_MODEL:}
  ai:
    # Calls per UTC day before non-critical AI features pause (0 = no cap).
    # Also editable in Settings → AI provider.
    daily-call-cap: ${AI_DAILY_CALL_CAP:2000}
    retry-base-ms: ${AI_RETRY_BASE_MS:1000}
  twilio:
    api-base-url: ${TWILIO_API_BASE_URL:https://api.twilio.com}
  # In-memory, per-IP, per-minute limits on the unauthenticated endpoints
  # someone could hammer (see RateLimitFilter). Single-node only.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    token-per-minute: ${RATE_LIMIT_TOKEN_PER_MINUTE:30}
    # Candidate "Run code" presses, per invite token (one candidate).
    run-per-minute: ${RATE_LIMIT_RUN_PER_MINUTE:10}
  # Candidate assessment-taking (F7).
  assessment:
    run-limit-per-question: ${ASSESSMENT_RUN_LIMIT:20}
    auto-submit-enabled: ${ASSESSMENT_AUTO_SUBMIT:true}
    auto-submit-interval-ms: 60000
  # Evaluation engine (F9).
  evaluation:
    code-write-test-share: 0.7
    rubric-half-below: 0.5
    rubric-zero-below: 0.25
    disagreement-threshold: 0.15
    hardcode-min-literal-length: 3
    stuck-after-minutes: 5
    retry-window-minutes: 60
    retry-enabled: ${EVALUATION_RETRY:true}
    sweep-interval-ms: 60000
  # Code runner (self-hosted Piston; its URL is saved in Settings).
  runner:
    max-concurrency: ${RUNNER_MAX_CONCURRENCY:8}
    queue-wait-ms: ${RUNNER_QUEUE_WAIT_MS:30000}
    runtimes-cache-ms: 300000

# Only health is exposed, and without component details, so /actuator/health
# is safe to leave public for load balancers / uptime checks.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    # requestId comes from RequestIdFilter (blank outside a request).
    level: "%5p [%X{requestId:-}]"
